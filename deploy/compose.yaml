# Deploy only after choosing a host and DNS. No AI endpoint exposed publicly.
services:
  zamakan:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      ZAMAKAN_LOCAL_MODEL: ""
      ZAMAKAN_AUTH_DB: /app/state/accounts.sqlite
      ZAMAKAN_PUBLIC_ORIGIN: https://${ZAMAKAN_DOMAIN:?Set your domain name}
    volumes:
      - zamakan_state:/app/state
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose: ["8080"]
  caddy:
    image: caddy:2-alpine
    environment:
      ZAMAKAN_DOMAIN: ${ZAMAKAN_DOMAIN:?Set your domain name}
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      zamakan:
        condition: service_healthy
    restart: unless-stopped
volumes:
  zamakan_state:
  caddy_data:
  caddy_config:
