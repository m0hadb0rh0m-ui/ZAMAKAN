name: Security checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm ci --prefix desktop --ignore-scripts
      - run: |
          mkdir -p security-reports
          npm sbom --sbom-format cyclonedx > security-reports/web.cdx.json
          npm sbom --prefix desktop --sbom-format cyclonedx > security-reports/desktop.cdx.json
      - run: |
          npm audit --audit-level=high
          npm audit --prefix desktop --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-sbom
          path: security-reports/
