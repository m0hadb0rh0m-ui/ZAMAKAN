name: Owner provider access check
on:
  workflow_dispatch:
  push:
    branches: [feature/zamakan-ultra-map-ui]
    paths: ['.github/workflows/provider-check.yml', 'scripts/check-owner-keys.mjs']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-owner-keys.mjs
        env:
          MAPTILER_PUBLIC_KEY: ${{ secrets.MAPTILER_PUBLIC_KEY }}
          CESIUM_PUBLIC_TOKEN: ${{ secrets.CESIUM_PUBLIC_TOKEN }}
