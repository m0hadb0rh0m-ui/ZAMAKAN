name: ZAMAKAN build
on:
  push:
    branches: [main, feature/zamakan-ultra-map-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          npm run serve &
          sleep 2
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAMAKAN-screenshots
          path: /tmp/zamakan-screenshots/*
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMAKAN-web
          path: dist/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run android:init
      - run: npm run android:sync
      - working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMAKAN-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
