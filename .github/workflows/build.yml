name: ZAMAKAN build
on:
  push:
    branches: [main, feature/zamakan-ultra-map-ui, feature/zamakan-experience]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          npm run serve &
          sleep 2
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAMAKAN-screenshots
          path: /tmp/zamakan-screenshots/*
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMAKAN-web
          path: dist/
      - name: Verify commercial profile fails closed without credentials
        run: |
          VITE_RELEASE_MODE=commercial npm run build
          PORT=4174 node server/index.js &
          sleep 2
          ZAMAKAN_URL=http://127.0.0.1:4174 python tests/commercial_smoke.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run android:init
      - run: npm run android:sync
      - working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMAKAN-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab

      - name: Verify release signing pipeline with a disposable test certificate
        env:
          ZAMAKAN_VERSION_CODE: '1'
          ZAMAKAN_VERSION_NAME: '1.0.0-test'
        run: |
          set -euo pipefail
          umask 077
          export ZAMAKAN_KEYSTORE_PATH="$RUNNER_TEMP/zamakan-disposable-test.p12"
          export ZAMAKAN_STORE_PASSWORD="$(openssl rand -hex 24)"
          export ZAMAKAN_KEY_PASSWORD="$ZAMAKAN_STORE_PASSWORD"
          export ZAMAKAN_KEY_ALIAS=test
          trap 'rm -f "$ZAMAKAN_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -storetype PKCS12 -keystore "$ZAMAKAN_KEYSTORE_PATH" -storepass:env ZAMAKAN_STORE_PASSWORD -keypass:env ZAMAKAN_KEY_PASSWORD -alias test -keyalg RSA -keysize 3072 -validity 2 -dname "CN=ZAMAKAN DISPOSABLE CI TEST"
          export EXPECTED_UPLOAD_SHA256="$(keytool -exportcert -rfc -keystore "$ZAMAKAN_KEYSTORE_PATH" -storepass:env ZAMAKAN_STORE_PASSWORD -alias test | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)"
          node scripts/android-release.mjs
          (cd android && ./gradlew assembleRelease bundleRelease --no-daemon)
          bash scripts/verify-android-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMAKAN-release-signing-test-NOT-FOR-STORE
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            release-checksums.sha256
          if-no-files-found: error
          retention-days: 7
