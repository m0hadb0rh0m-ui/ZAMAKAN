name: Signed production packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-production
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    environment: production-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci && npm test && npm run build && npx cap add android
      - name: Optional Firebase configuration
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_B64" | base64 -d > android/app/google-services.json
          fi
          python3 scripts/android-config.py
          npx cap sync android
      - working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign and verify
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Missing Android signing keystore}"
          : "${ANDROID_STORE_PASSWORD:?Missing password}"
          : "${ANDROID_KEY_ALIAS:?Missing alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password}"
          umask 077
          ks="$(mktemp)"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -printf '%h\n' | sort -V | tail -1)"
          mkdir -p signed
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk signed/aligned.apk
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out signed/ZAMAKAN-release.apk signed/aligned.apk
          rm signed/aligned.apk
          "$tools/apksigner" verify --verbose --print-certs signed/ZAMAKAN-release.apk
          (cd signed && sha256sum ZAMAKAN-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: {name: ZAMAKAN-android-signed, path: signed/, if-no-files-found: error}
  windows:
    runs-on: windows-latest
    environment: production-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - shell: pwsh
        run: |
          Copy-Item -Recurse dist desktop/dist
          Copy-Item -Recurse server desktop/server
          Copy-Item -Recurse shared desktop/shared
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'Trusted Windows signing credentials required' }
          npm run package:win -- --config.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $files=Get-ChildItem release/*.exe
          if (-not $files) { throw 'No signed executable' }
          foreach ($file in $files) {
            $s=Get-AuthenticodeSignature $file.FullName
            if ($s.Status -ne 'Valid') { throw "Untrusted signature: $($s.Status)" }
          }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMAKAN-windows-signed
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
