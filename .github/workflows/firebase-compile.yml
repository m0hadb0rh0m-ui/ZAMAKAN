name: Firebase integration compile
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['native/android/**','scripts/android-config.py','.github/workflows/firebase-compile.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci && npm run build && npx cap add android
      - name: Build-only Firebase fixture (not a real project)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d={"project_info":{"project_number":"000000000000","project_id":"zamakan-compile-fixture","storage_bucket":"zamakan-compile-fixture.invalid"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"org.zamakan.earth"}},"api_key":[{"current_key":"NOT_A_REAL_API_KEY"}]}],"configuration_version":"1"}
          Path("android/app/google-services.json").write_text(json.dumps(d))
          PY
          python3 scripts/android-config.py
          npx cap sync android
      - working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Remove non-distributable fixture build
        if: always()
        run: rm -f android/app/google-services.json; rm -rf android/app/build/outputs/apk
