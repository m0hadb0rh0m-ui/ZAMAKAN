name: CAP live connectivity
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: node scripts/cap-live-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cap-live-connectivity, path: cap-live-report.json, if-no-files-found: error}
