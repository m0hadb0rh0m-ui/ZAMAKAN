name: Open weather snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '35 */6 * * *'
permissions:
  contents: read
concurrency:
  group: weather-data
  cancel-in-progress: false
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/weather-requirements.txt
      - run: sh scripts/update-weather.sh
      - uses: actions/upload-artifact@v4
        with:
          name: weather-snapshots
          path: weather-data/*.json
          retention-days: 2
          if-no-files-found: error
