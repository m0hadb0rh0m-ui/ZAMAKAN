name: Staging source integration
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.26.0
      - run: |
          ZAMAKAN_SOURCE_MODE=mock ZAMAKAN_AUTH_DB="$(mktemp -u)" npm run serve &
          sleep 2
          python tests/api_contract.py
  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/live-probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-source-report
          path: live-source-report.json
